<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版校档案 · ProofArchive</title><link rel="stylesheet" href="/static/archive.css"></head><body>
<aside><a class="brand" href="/">版校<span>PROOF ARCHIVE</span></a><p class="small">图像版面 / 印前审校 / 留档</p><button id="new">＋ 新建档案</button><button id="demo">装载合成校样</button><button id="import">导入档案 ZIP</button><div id="documents"></div><a class="lab" href="/image-lab" target="_blank">图像准备工具 ↗</a><p class="small">单用户本地版<br>原始版次不可变，审校记录留存。</p></aside>
<main><header><div><div class="eyebrow">EDITORIAL / PROOF / ARCHIVE</div><h1 id="title">每个版次，都有来处。</h1><p id="notes">导入栅格版面，记录批注，比较修改并保存交付档案。</p></div><span id="revision">READY</span></header>
<section class="toolbar"><button id="upload">＋ 导入页面</button><button id="versionUpload">新增当前页版次</button><button id="reviewFlow">批注连续审阅</button><button id="reviewExport">审阅包 ↓</button><button id="reviewImport">导回审阅包</button><button id="preflight">版面预检</button><button id="contact">联系样张</button><button id="package">档案 ZIP ↓</button><button id="report">审校报告 ↓</button><button id="snapshots">快照</button></section>
<div class="workspace"><section class="pages"><h3>版面 <span id="pageCount">0</span></h3><div id="pages"></div></section><section class="viewer"><div class="viewbar"><h2 id="pageTitle">等待选择版面</h2><label><input id="showAnnotations" type="checkbox" checked>批注框</label><button id="download">原图 ↓</button></div><div id="stage"><img id="image" hidden><div id="empty">▧<p>从一份校样开始</p><small>PNG / JPEG / 单页 TIFF</small></div></div><div class="viewbar"><span id="dimensions">—</span><button id="stats">区域统计</button><button id="transform">裁切 / 旋转校样</button><button id="spec">版面规格</button></div></section><section class="inspector"><h3>版本与审校</h3><label>当前版次<select id="versions"></select></label><button id="compare">比较两个版次</button><button id="separation">软分色 / 总墨量</button><div class="divider"></div><label>审校状态<select id="status"><option value="unreviewed">待审校</option><option value="changes">待修改</option><option value="approved">已批准</option></select></label><button id="review">记录审校意见</button><div class="divider"></div><h3>区域批注 <button id="annotate">＋</button></h3><p class="small">批注属于具体版次。坐标按原图宽高归一化。</p><div id="annotations"></div><div class="divider"></div><button id="moveUp">页面上移</button><button id="duplicate">复制页面</button><button id="remove">移除页面</button></section></div><footer>PROOFARCHIVE · 栅格版面校样 / 简化软分色不代替印厂 ICC 分色</footer></main>
<dialog id="dialog"><div class="dialogbar"><h2 id="dialogTitle"></h2><button id="close">✕</button></div><div id="dialogBody"></div></dialog><div id="reviewOverlay" class="review-overlay" hidden><div class="review-head"><div><h2 id="rvTitle">批注连续审阅</h2><p id="rvSub" class="small"></p></div><div class="review-head-actions"><label class="rv-check"><input id="rvScope" type="checkbox">显示已解决</label><button id="rvExport">审阅包 ↓</button><button id="rvClose">退出审阅</button></div></div><div class="review-body"><nav class="rv-list" id="rvList"></nav><section class="rv-stage"><div class="rv-stage-bar"><span id="rvCrumb"></span><span id="rvState" class="rv-pill"></span></div><div class="rv-images"><figure><figcaption>整页定位</figcaption><div class="rv-frame"><img id="rvPage" alt="整页定位图"></div></figure><figure><figcaption>局部上下文</figcaption><div class="rv-frame"><img id="rvCrop" alt="批注局部图"></div></figure></div><div class="rv-detail"><div id="rvText"></div><div id="rvBounds" class="small"></div><div id="rvNoteWrap" class="rv-note-wrap" hidden><label>同事审校意见<textarea id="rvNote" rows="3" readonly></textarea></label></div><div class="rv-actions"><button id="rvResolve" class="rv-primary"></button><button id="rvEdit">修改批注</button><button id="rvPrev">上一条</button><button id="rvNext">下一条</button></div><div class="rv-jump" id="rvJump"></div></div></section></div></div><input id="reviewZip" type="file" accept=".zip" hidden><link rel="stylesheet" href="/static/review.css"><div id="toast"></div><input id="files" type="file" multiple accept="image/*" hidden><input id="zipfile" type="file" accept=".zip" hidden><script src="/static/archive.js"></script><script src="/static/review.js"></script></body></html>
